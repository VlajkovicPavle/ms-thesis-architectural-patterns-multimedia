global:
  scrape_interval: 5s

scrape_configs:
  - job_name: app
    metrics_path: /api/actuator/prometheus
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/app.json
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [metrics_path]
        target_label: __metrics_path__
      - regex: metrics_path
        action: labeldrop

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
