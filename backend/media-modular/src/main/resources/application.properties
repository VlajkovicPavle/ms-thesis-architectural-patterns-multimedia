spring.application.name=media-modular
app.storage.local.path=/home/pavlev/media/modular

spring.jpa.show-sql=true
logging.level.org.hibernate.tool.schema=DEBUG

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://localhost:5433/media_modular
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

rendition.pool-size=8

management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.variant=modular
management.metrics.tags.service=media-modular
