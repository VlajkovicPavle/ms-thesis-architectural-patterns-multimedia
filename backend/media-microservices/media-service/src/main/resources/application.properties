spring.application.name=media-service
server.servlet.context-path=/api
spring.datasource.url=jdbc:postgresql://localhost:5432/media_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:media_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:media_password}
spring.jpa.hibernate.ddl-auto=update
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=true
spring.rabbitmq.listener.simple.retry.enabled=false
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
app.storage.local.path=${APP_STORAGE_LOCAL_PATH:/tmp/media-microservices}
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.variant=microservices
management.metrics.tags.service=media-service
