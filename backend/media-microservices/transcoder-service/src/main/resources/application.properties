spring.application.name=transcoder-service
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.concurrency=${rendition.pool-size:8}
spring.rabbitmq.listener.simple.max-concurrency=${rendition.pool-size:8}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=true
spring.rabbitmq.listener.simple.retry.enabled=false
rendition.pool-size=${RENDITION_POOL_SIZE:8}
app.storage.local.path=${APP_STORAGE_LOCAL_PATH:/tmp/media-microservices}
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.variant=microservices
management.metrics.tags.service=transcoder-service
